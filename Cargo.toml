[package]
name = "claude-session-limit"
version = "0.1.0"
edition = "2024"
description = "Tiny borderless widget showing Claude Code 5h session usage"

[dependencies]
ab_glyph = "0.2.32"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen"] }
ureq = { version = "2", features = ["json"] }
winit = { version = "0.30", default-features = false, features = ["x11", "rwh_06"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
